name: Temporary Android hotfix toolchain transport
on:
  push:
    paths:
      - ".github/workflows/bootstrap-hotfix-toolchain.yml"
  pull_request:
    paths:
      - ".github/toolchain-trigger"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  split:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lavs-android36-hotfix-toolchain
          path: ${{ runner.temp }}/source
          github-token: ${{ github.token }}
          repository: tylerparker91/local-ai-video-models
          run-id: 32737710671
      - name: Split below connector limit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/parts"
          split --bytes=480M --numeric-suffixes=0 --suffix-length=2             "$RUNNER_TEMP/source/lavs-android36-hotfix-toolchain.tar.zst"             "$RUNNER_TEMP/parts/lavs-toolchain.part-"
          test -f "$RUNNER_TEMP/parts/lavs-toolchain.part-00"
          test -f "$RUNNER_TEMP/parts/lavs-toolchain.part-01"
          test -f "$RUNNER_TEMP/parts/lavs-toolchain.part-02"
          sha256sum "$RUNNER_TEMP/parts/"*
      - uses: actions/upload-artifact@v4
        with:
          name: lavs-toolchain-part-00
          path: ${{ runner.temp }}/parts/lavs-toolchain.part-00
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: lavs-toolchain-part-01
          path: ${{ runner.temp }}/parts/lavs-toolchain.part-01
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: lavs-toolchain-part-02
          path: ${{ runner.temp }}/parts/lavs-toolchain.part-02
          compression-level: 0
          retention-days: 1
