name: Temporary JDK 17 hotfix compiler transport
on:
  push:
    paths:
      - ".github/workflows/bootstrap-hotfix-toolchain.yml"
  pull_request:
    paths:
      - ".github/toolchain-trigger"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle-jdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Bundle dereferenced JDK
        shell: bash
        run: |
          set -euo pipefail
          tar -chzf "$RUNNER_TEMP/lavs-jdk17.tar.gz" -C "$JAVA_HOME" .
          test -x "$JAVA_HOME/bin/javac"
          sha256sum "$RUNNER_TEMP/lavs-jdk17.tar.gz"
          du -h "$RUNNER_TEMP/lavs-jdk17.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: lavs-jdk17
          path: ${{ runner.temp }}/lavs-jdk17.tar.gz
          compression-level: 0
          retention-days: 1
